<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    
    <!-- Título & Identidade -->
    <title>MP CARGAS — Gerador de Etiquetas</title>
    <meta name="description" content="Sistema de Gestão, Consulta e Impressão de Etiquetas de Patrimônio MP CARGAS" />

    <!-- PWA / Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS / iPhone (Pro, Pro Max, Normal) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MP Patrimônio" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  </head>
  <body class="bg-[#F8F9FA] text-[#111111] min-h-full flex flex-col antialiased selection:bg-[#FFD100] selection:text-black">
    <div id="root" class="flex-1 flex flex-col"></div>
    <div id="mp-print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Registro do Service Worker para PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
